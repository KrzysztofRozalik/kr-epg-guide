name: Aktualizacja EPG

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: epg-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      EPG_SITE_DIR: ${{ github.workspace }}/epg-site
      EPG_STATE_PATH: ${{ github.workspace }}/epg-state.sqlite3
      EPG_OUTPUT_DIRECTORY: ${{ github.workspace }}/epg-site/v1
      EPG_PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/v1
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}

    steps:
      - name: Pobierz generator i repozytorium wydawnicze
        uses: actions/checkout@v4
        with:
          path: generator

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generator/pyproject.toml

      - name: Przywróć dzienny cache metadanych
        id: cache-date
        shell: bash
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache metadanych
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/epg-state.sqlite3
          key: epg-state-${{ runner.os }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            epg-state-${{ runner.os }}-

      - name: Cache logotypów kanałów
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/epg-site/v1/dom/logos
          key: epg-logos-${{ runner.os }}-${{ steps.cache-date.outputs.month }}
          restore-keys: |
            epg-logos-${{ runner.os }}-

      - name: Zbuduj i sprawdź EPG
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ./generator
          mkdir -p "$EPG_SITE_DIR"
          cp -R generator/deploy/github-pages/site/. "$EPG_SITE_DIR/"
          if [ -n "${TMDB_API_TOKEN:-}" ]; then
            export TMDB_ENABLED=true
          else
            export TMDB_ENABLED=false
          fi
          kr-live-epg build --config generator/deploy/github-pages/config.pages.yaml
          kr-live-epg validate "$EPG_OUTPUT_DIRECTORY/dom/epg.xml.gz"
          kr-live-epg validate "$EPG_OUTPUT_DIRECTORY/lekki/epg.xml.gz"
          kr-live-epg validate "$EPG_OUTPUT_DIRECTORY/dom/epg.xml"
          kr-live-epg validate "$EPG_OUTPUT_DIRECTORY/lekki/epg.xml"
          sha256sum \
            "$EPG_OUTPUT_DIRECTORY/dom/epg.xml.gz" \
            "$EPG_OUTPUT_DIRECTORY/lekki/epg.xml.gz" \
            > "$EPG_SITE_DIR/checksums.sha256"

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5

      - name: Przygotuj artefakt Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/epg-site

      - name: Opublikuj ostatnią poprawną wersję
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Cotygodniowy znacznik aktywności repozytorium
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        shell: bash
        working-directory: generator
        run: |
          set -euo pipefail
          if [ "$(date -u +%u-%H)" != "1-00" ]; then
            exit 0
          fi
          date -u +%Y-%m-%dT%H:%M:%SZ > .epg-heartbeat
          git config user.name "KR Live EPG Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .epg-heartbeat
          git commit -m "chore: keep scheduled EPG active"
          git push
